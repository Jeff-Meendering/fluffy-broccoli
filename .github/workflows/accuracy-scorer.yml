name: Accuracy scorer contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorer:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned scorer dependency
        run: python -m pip install --require-hashes -r tools/accuracy/scorer-requirements.lock
      - name: Test scoring, mappings, annotation agreement and corpus integrity
        run: python -m unittest discover -s tools/accuracy -v
