[workspace]
members = ["crates/core", "crates/cli", "crates/app", "crates/xtask", "crates/case", "crates/isolation"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Jeff-Meendering/fluffy-broccoli"
homepage = "https://github.com/Jeff-Meendering/fluffy-broccoli"

[workspace.dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.100"
base64 = "0.22.1"
bech32 = "0.12.0"
bs58 = "0.5.1"
bzip2 = "0.6.1"
calamine = "0.38.0"
clap = { version = "4.5.60", features = ["derive"] }
crossbeam-channel = "0.5.15"
ctrlc = "3.5.1"
csv = "1.4.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts", "wayland", "x11"] }
encoding_rs = "0.8.44"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
hayro = "0.9.0"
idna = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "tiff", "webp"] }
lzma-rust2 = "0.25.0"
mail-parser = "1.0.1"
memchr = "2.7.6"
ndarray = "0.17.2"
one-note-converter = "0.1.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "api-31", "tls-rustls"] }
pdf-extract = "0.12.1"
percent-encoding = "2.3.2"
phonenumber = "0.3.10"
printpdf = { version = "0.12.8", default-features = false }
quick-xml = "0.42.0"
rars = { version = "0.12.4", default-features = false }
rayon = "1.11.0"
regex = "1.12.3"
rfd = "0.18.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["process", "fs", "event"] }
ripemd = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "bzip2", "deflate", "lz4", "ppmd", "zstd"] }
sha2 = "0.11.1"
tar = "0.4.44"
tempfile = "3.26.0"
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
zip = { version = "9.5.0", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "ppmd", "time", "xz", "zstd"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep unwinding so the scanner can isolate a third-party parser panic to one input.

[profile.bench]
inherits = "release"
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
