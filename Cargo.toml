[workspace]
members = [
    "crates/model",
    "crates/extract",
    "crates/detect",
    "crates/link",
    "crates/case",
    "crates/cli",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Jeff-Meendering/fluffy-broccoli"
publish = false

[workspace.dependencies]
rollcall-model = { path = "crates/model" }
rollcall-extract = { path = "crates/extract" }
rollcall-detect = { path = "crates/detect" }
rollcall-link = { path = "crates/link" }
rollcall-case = { path = "crates/case" }

anyhow = "1.0.100"
clap = { version = "4.5.60", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
tempfile = "3.26.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
