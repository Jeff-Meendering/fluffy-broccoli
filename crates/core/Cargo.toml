[package]
name = "pii-explorer-core"
description = "Fast, local PII detection, document extraction, and evidence reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["formats", "archives", "report"]
formats = ["dep:calamine", "dep:mail-parser", "dep:one-note-converter", "dep:pdf-extract"]
archives = ["dep:bzip2", "dep:flate2", "dep:lzma-rust2", "dep:rars", "dep:sevenz-rust2", "dep:tar", "dep:zip"]
ocr = ["dep:hayro", "dep:image"]
ner = ["dep:ndarray", "dep:ort"]
report = ["dep:printpdf"]
full = ["formats", "archives", "ocr", "ner", "report"]

[dependencies]
