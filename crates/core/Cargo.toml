crossbeam-channel.workspace = true
csv.workspace = true
encoding_rs.workspace = true
flate2 = { workspace = true, optional = true }
hayro = { workspace = true, optional = true }
idna.workspace = true
image = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
mail-parser = { workspace = true, optional = true }
memchr.workspace = true
ndarray = { workspace = true, optional = true }
one-note-converter = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }
phonenumber.workspace = true
printpdf = { workspace = true, optional = true }
quick-xml.workspace = true
rars = { workspace = true, optional = true }
rayon.workspace = true
regex.workspace = true
ripemd.workspace = true
serde.workspace = true
serde_json.workspace = true
sevenz-rust2 = { workspace = true, optional = true }
